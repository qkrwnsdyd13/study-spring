<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>게시판</title></head>
<body>
<h2>게시판</h2>
<a th:href="@{/posts/write}">글쓰기</a> | <a th:href="@{/}">홈</a>
<table border="1">
    <tr><th>번호</th><th>제목</th><th>작성자</th><th>작성일</th><th>조회</th></tr>
    <tr th:each="post : ${posts}">
        <td th:text="${post.id}"></td>
        <td><a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}"></a></td>
        <td th:text="${post.user.nickname}"></td>
        <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${post.viewCount}"></td>
    </tr>
</table>
<p th:if="${#lists.isEmpty(posts)}">아직 글이 없습니다.</p>
</body>
</html>
