<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('게시판')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
  <div class="list-head">
    <div>
      <h1 class="page-title">게시판</h1>
      <p class="page-desc" style="margin:0">모두의 이야기</p>
    </div>
    <a class="btn" th:href="@{/posts/write}">글쓰기</a>
  </div>

  <ul class="post-list" th:if="${!posts.isEmpty()}">
    <li class="post-item" th:each="post : ${posts}">
      <a th:href="@{/posts/{id}(id=${post.id})}">
        <strong th:text="${post.title}">제목</strong>
        <span class="post-meta" th:text="${post.user.nickname}">작성자</span>
      </a>
    </li>
  </ul>

  <p class="empty" th:if="${posts.isEmpty()}">아직 글이 없어요. 첫 글을 남겨 보세요.</p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
