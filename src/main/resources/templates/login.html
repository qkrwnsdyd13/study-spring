<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container narrow">
  <h1 class="page-title">로그인</h1>
  <p class="page-desc">다시 오신 걸 환영해요.</p>

  <div class="card">
    <form class="form" th:action="@{/auth/login}" method="post">

      <p class="alert" th:if="${error}" th:text="${error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>

      <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn">로그인</button>
    </form>
  </div>

  <p class="helper">계정이 없나요? <a th:href="@{/auth/register}">회원가입</a></p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
