<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!-- 공통 head: 페이지마다 제목만 넘겨서 사용 -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · STARLOG'">STARLOG</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- 공통 헤더 -->
<header th:fragment="header" class="site-header">
  <nav class="container nav">
    <a class="brand" th:href="@{/}">STARLOG</a>
    <div class="nav-links">
      <a th:href="@{/posts/write}">글쓰기</a>
      <a th:href="@{/posts}">게시판</a>
      <a th:href="@{/fortune}">운세</a>
    </div>
  </nav>
</header>

<!-- 공통 푸터 -->
<footer th:fragment="footer" class="site-footer">
  <div class="container">© STARLOG</div>
</footer>

</body>
</html>
