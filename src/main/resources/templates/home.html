<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('홈')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">

  <!-- 로그인 했을 때 -->
  <section th:if="${nickname != null}">
    <h1 class="page-title"><span th:text="${nickname}">닉네임</span>님, 안녕하세요</h1>
    <p class="page-desc">오늘은 무엇을 기록할까요?</p>

    <div class="grid">
      <a class="link-card" th:href="@{/posts/write}">
        <strong>글쓰기</strong>
        <span>새 게시글을 작성합니다</span>
      </a>
      <a class="link-card" th:href="@{/fortune}">
        <strong>오늘의 운세</strong>
        <span>생년월일로 보는 하루 운세</span>
      </a>
    </div>

    <form th:action="@{/logout}" method="post" class="actions" style="margin-top:24px">
      <button type="submit" class="btn btn-outline">로그아웃</button>
    </form>
  </section>

  <!-- 로그인 안 했을 때 -->
  <section th:unless="${nickname != null}">
    <h1 class="page-title">STARLOG</h1>
    <p class="page-desc">학교 이야기를 기록하는 작은 커뮤니티</p>

    <div class="actions">
      <a class="btn" th:href="@{/auth/login}">로그인</a>
      <a class="btn btn-outline" th:href="@{/auth/register}">회원가입</a>
    </div>
  </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
